<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabEcho</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="app" class="popup-container">
      <header class="header">
        <div class="brand">
          <img src="../../public/icon32.png" alt="" class="logo" />
          <div>
            <h1 class="title">TabEcho</h1>
            <p class="tagline">One Action. Every Tab.</p>
          </div>
        </div>
        <span id="statusBadge" class="status-badge status-idle">IDLE</span>
      </header>

      <main class="main-content">
        <div id="sessionSummaryCard" class="summary-card">
          <p id="summaryText" class="summary-text">No active live session</p>
        </div>

        <div class="actions">
          <button id="btnOpenControlCenter" class="btn btn-primary btn-block">
            🖥 Open TabEcho Control Center
          </button>

          <div class="btn-group">
            <button id="btnPauseResume" class="btn btn-warning" disabled>
              ⏸ Pause
            </button>
            <button id="btnEmergencyStop" class="btn btn-danger" disabled>
              🚨 Stop
            </button>
          </div>
        </div>
      </main>

      <footer class="footer">
        Live Sync · Multi-Window · Local Only
      </footer>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
